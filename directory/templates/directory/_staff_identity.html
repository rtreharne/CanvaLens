    title="Signed in as {{ staff_username }}"
    style="margin-left:auto; color:#d8e0ef; font-size:0.78rem; font-weight:400; opacity:0.9;"

    {{ staff_username }}

{% else %}
  <div style="margin-left:auto;"></div>
{% endif %}
