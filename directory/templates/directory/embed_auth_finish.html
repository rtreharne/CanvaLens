{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas Lens Sign-in Complete</title>
  <link rel="stylesheet" href="https://www.liverpool.ac.uk/rb/latest/assets/redbrick.css" />
  <style>
    .rb-page { background: #f5f6fa; }
    .rb-login { max-width: 760px; margin: 40px auto 70px; }
    .rb-header__section .rb-block-container { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 64px; padding-top: 10px; }
    .rb-header__logo { height: 50px; width: auto; opacity: 0.85; margin-left: 0; }
    .rb-title-block { display: flex; flex-direction: column; justify-content: center; min-height: 96px; }
    .rb-title-block .rb-lockup { font-size: 300%; }
  </style>
</head>
<body class="rb-page">
  <header class="rb-header">
    <div class="rb-header__global rb-header__container">
      <a href="https://www.liverpool.ac.uk/" class="rb-header__global__home">
        <span class="sr-only">Home</span>
      </a>
    </div>
    <div class="rb-header__section">
      <div class="rb-block-container">
        <img class="rb-header__logo" src="{% static 'uol_logo_reversed.png' %}" alt="University of Liverpool" />
      </div>
    </div>
  </header>

  <section class="rb-block-cover bg-rb--color--blue text-white">
    <div class="rb-block-container">
      <div class="rb-title-block">
        <h2 class="rb-lockup">Canvas Lens</h2>
      </div>
    </div>
  </section>

  <section class="rb-block-cover">
    <div class="rb-block-container rb-login">
      <div class="rb-card">
        <div class="rb-card__inner">
          {% include "directory/_staff_identity.html" %}
          <h2 class="rb-card__title">Sign-in complete</h2>
          <p>You can close this tab and return to Canvas.</p>
          <div class="rb-buttongroup">
            <a class="rb-button rb-button--primary" href="{{ consume_url }}">Continue in Canvas Lens</a>
            <a class="rb-button rb-button--ghost" href="{{ next_path }}">Open App in This Tab</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  {% include "directory/_site_footer.html" %}

  <script>
    (function () {
      const consumeUrl = "{{ consume_url|escapejs }}";
      const payload = {
        type: "canvaslens:embed-auth-complete",
        consumeUrl: consumeUrl,
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
          window.close();
          return;
        }
      } catch (err) {
        // Fallback below.
      }
    })();
  </script>
</body>
</html>
