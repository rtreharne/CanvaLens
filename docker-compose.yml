services:
  web:
    build: .
    env_file: .env
    ports:
      - "8010:8000"
    depends_on:
      - db
      - redis
    command: gunicorn canvaslens.wsgi:application -b 0.0.0.0:8000

  worker:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    command: celery -A canvaslens worker -l info

  scheduler:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis
    command: celery -A canvaslens beat -l info

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: canvaslens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  postgres_data:
